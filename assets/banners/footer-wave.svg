<svg width="100%" height="200" viewBox="0 0 1200 200" xmlns="http://www.w3.org/2000/svg" style="margin-bottom: -5px;" preserveAspectRatio="none">
  <defs>
    <linearGradient id="footer-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF1493;stop-opacity:0.8" />
      <stop offset="33%" style="stop-color:#FF69B4;stop-opacity:0.8" />
      <stop offset="66%" style="stop-color:#FFB6C1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FF1493;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  <path fill="url(#footer-grad)">
    <animate attributeName="d" 
      values="M0,100 Q300,50 600,100 T1200,100 L1200,200 L0,200 Z;
              M0,100 Q300,150 600,100 T1200,100 L1200,200 L0,200 Z;
              M0,100 Q300,50 600,100 T1200,100 L1200,200 L0,200 Z" 
      dur="10s" 
      repeatCount="indefinite" />
  </path>
  <path fill="url(#footer-grad)" opacity="0.5">
    <animate attributeName="d" 
      values="M0,120 Q300,80 600,120 T1200,120 L1200,200 L0,200 Z;
              M0,120 Q300,160 600,120 T1200,120 L1200,200 L0,200 Z;
              M0,120 Q300,80 600,120 T1200,120 L1200,200 L0,200 Z" 
      dur="8s" 
      repeatCount="indefinite" />
  </path>
</svg>
